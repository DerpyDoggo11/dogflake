<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <link rel="stylesheet" href="https://amazinaxel.com/css/reset.css" />
  <link rel="stylesheet" href="https://amazinaxel.com/css/vars.css" />
  <link rel="stylesheet" href="https://amazinaxel.com/css/typography.css" />
  <link rel="stylesheet" href="https://amazinaxel.com/css/layout.css" />
  <link rel="stylesheet" href="https://amazinaxel.com/css/other.css" />
  <title>Nocturn tracker</title>

  <style>
    #content {
      text-align: center;
    }

    h1 {
      padding: 0.5rem;
      margin: 0;
    }

    hr {
      margin: 1rem;
    }

    #servers {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin: 1rem auto;
      max-width: 700px;
    }

    .server {
      flex: 1 1 12rem;
      padding: 0.8rem 1rem;
      border-radius: 0.3rem;
      border: 6px solid var(--darkest2);
    }

    .server .name {
      color: var(--accent);
    }

    .server .count {
      font-size: 2.4rem;
      font-weight: bold;
    }

    .server .peaks {
      opacity: 0.7;
      font-size: 0.9rem;
    }

    .server.offline .count {
      opacity: 0.4;
    }

    #chart {
      max-width: 700px;
      margin: 1rem auto 1.5rem auto;
      background: var(--blue3);
      border-radius: 0.3rem;
      box-shadow: 0 0 1rem var(--blue3);
    }

    #lastUpdatedText,
    #lastUpdated {
      color: var(--blue2);
      padding-top: 1rem;
      padding-bottom: 0.5rem;
    }

    #lastUpdated {
      font-weight: bold;
    }
  </style>
  <link href="https://unpkg.com/uplot@1.6.17/dist/uPlot.min.css" rel="stylesheet">
  <script src="https://unpkg.com/uplot@1.6.17/dist/uPlot.iife.min.js"></script>
</head>

<body>
  <div id="content">
    <h1>Nocturn tracker</h1>
    <div id="servers"></div>
    <hr>
    <div id="chart"></div>
    <label class="container">
      <input type="checkbox" id="show7days">
      <span class="checkmark"></span>
      Show data from the past week
    </label>
    <p id="lastUpdatedText">Last updated at <span id="lastUpdated"></span></p>
    <button class="button" onclick="refreshData()">Refresh data</button>
  </div>

  <script>
    const serversElement = document.getElementById('servers');
    const lastUpdatedElement = document.getElementById('lastUpdated');
    const refreshButtonElement = document.getElementsByClassName('button')[0];
    const chartElement = document.getElementById('chart');
    const get7Days = document.getElementById('show7days');

    const series = [
      {key: 'mh', label: 'Minehut', color: '#81A1C1'},
      {key: 'mk', label: 'Minekeep', color: '#BF616A'},
      {key: 'total', label: 'Combined', color: '#A3BE8C'}
    ];

    // both offline stays a gap, otherwise absent counts as 0
    const combine = (sample) => (sample.mh == null && sample.mk == null)
      ? null
      : (sample.mh ?? 0) + (sample.mk ?? 0);

    async function refreshData() {
      refreshButtonElement.innerHTML = "Refreshing...";

      const response = (get7Days.checked)
        ? await fetch("/getdata/week")
        : await fetch("/getdata");

      if (!response.ok) {
        refreshButtonElement.innerHTML = "Failed - Try again";
        return;
      };

      const {samples} = await response.json();
      if (!samples.length) {
        refreshButtonElement.innerHTML = "No data yet";
        return;
      };

      const values = {
        mh: samples.map(s => s.mh),
        mk: samples.map(s => s.mk),
        total: samples.map(combine)
      };
      const latest = samples.at(-1);
      const current = {mh: latest.mh, mk: latest.mk, total: combine(latest)};

      // peak over the shown window, ignoring offline gaps
      const peak = (key) => Math.max(0, ...values[key].filter(v => v != null));

      serversElement.innerHTML = series.map(({key, label, color}) => `
          <div class="server ${current[key] == null ? 'offline' : ''}" style="--accent: ${color}">
              <p class="name">${label}</p>
              <p class="count">${current[key] ?? 'offline'}</p>
              <p class="peaks">(${get7Days.checked ? '7d' : '24h'} peak: ${peak(key)})</p>
          </div>
      `).join('');

      lastUpdatedElement.innerHTML = new Date(Number(latest.timestamp)).toLocaleString('en-US', {
        hour: 'numeric',
        minute: 'numeric',
        hour12: true
      });
      refreshButtonElement.innerHTML = "Refresh data";

      // Render chart
      const timestamps = samples.map(s => s.timestamp / 1000);
      const opts = {
        width: chartElement.offsetWidth,
        height: 300,
        scales: {x: {time: true}, y: {auto: true}},
        axes: [{
          label: "Time",
          values: (u, ticks) => ticks.map(t =>
            new Date(t * 1000).toLocaleTimeString('en-US', {
              hour: '2-digit',
              minute: '2-digit',
              hour12: false
            })
          )
        }],
        series: [{}, ...series.map(({label, color}) => ({
          label,
          stroke: color,
          width: 2,
          spanGaps: false // offline shows as a break
        }))],
        cursor: {
          x: false,
          y: false,
          points: {size: 8}
        }
      };
      chartElement.innerHTML = ""; // Clear old chart
      new uPlot(opts, [timestamps, values.mh, values.mk, values.total], chartElement);
    };
    refreshData();
    setInterval(refreshData, 60000); // poll

    get7Days.addEventListener('change', refreshData);
    document.addEventListener('keydown', (event) => (event.key === 'r') && refreshData());
  </script>
</body>

</html>
